# Settings for the 3D ASCII monitor on your profile.
# Edit, commit, and the GitHub Action re-renders the animation.
#where the real data lives

github_user: Roro141

# shown on the monitor screen (keep each under ~36 characters)
name: roha fatima
role: full stack dev · cs @ utd 

# "currently building" line.
# Leave pin_project empty to auto-use your most recently pushed public repo.
# Set it to force a specific project.
pin_project: ""
pin_description: ""

# used if the GitHub API is unreachable
fallback_project: planner
fallback_description: personal life manager

# repos that should never show up as "currently building"
exclude_repos:
  - Portfolio
  - CS_Portfolio

# prettier names for repos, e.g.  my-repo-name: my cool app
display_names: {}

# animation
fps: 12
loop_seconds: 9
sway_degrees: 32

colors:
  dark:
    body: "#8b949e"
    screen: "#4ee0c6"
  light:
    body: "#57606a"
    screen: "#0b7f6d"
