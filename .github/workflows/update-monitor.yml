name: update monitor

on:
  schedule:
    - cron: "17 13 * * *"     # daily, 6:17am Pacific
  push:
    paths:
      - config.yml
      - scripts/**
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Render 3D ASCII monitor
        run: python scripts/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || (git commit -m "monitor: update currently building" && git push)
